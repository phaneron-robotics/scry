# Production scry-connect compose for "drop on a real robot" use.
#
# Sidecar deployment: a tiny container that runs the connect alongside
# the rest of the robot's ROS 2 stack on ``network_mode: host``, so it
# sees the host's DDS bus and every existing node without any extra
# wiring.
#
# Build locally from PyPI:
#   docker compose build         # picks up SCRY_CONNECT_VERSION arg
#   docker compose up -d
#
# To bump the version on a robot:
#   1. Edit SCRY_CONNECT_VERSION below.
#   2. docker compose build --pull && docker compose up -d
#
# Why not pull a prebuilt image from a registry?
#   Releases also publish to ghcr.io/phaneron-robotics/scry-connect, but
#   the org's package-visibility policy currently blocks anonymous
#   pulls — so anyone running ``docker pull`` without auth would fail.
#   Building from PyPI sidesteps that until the policy is changed. The
#   bits produced here are functionally identical to the registry image.

services:
  scry-connect:
    image: scry-connect:0.1.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: jazzy
        SCRY_CONNECT_VERSION: "0.1.1"
    network_mode: host
    # `pid: host` so `ros_list_nodes_with_resources` can walk /proc to find
    # the OS pids backing each ROS node. Without it, the Processes view in
    # the Scry app only sees the connect itself.
    pid: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - SCRY_PORT=${SCRY_PORT:-5339}
    restart: unless-stopped
