# GUI override for the dev stack — mounts the host X11 socket into the
# turtlesim container so you can see the window.
#
# Security note
# -------------
# Mounting /tmp/.X11-unix gives the container access to the host's X display.
# Combined with `network_mode: host` this is a significant trust boost —
# only enable on development machines, never on a shared host.
#
# Usage:
#   xhost +local:docker
#   docker compose -f docker-compose.dev.yml -f docker-compose.gui.yml up
#
# When done:
#   xhost -local:docker

services:
  turtlesim:
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
