site_name: Scry
site_description: AI-first debugging for ROS 2 robots, from your Android phone.
site_url: https://phaneron-robotics.github.io/scry/
repo_url: https://github.com/phaneron-robotics/scry
repo_name: phaneron-robotics/scry
edit_uri: ""

copyright: Copyright &copy; 2026 Phaneron Robotics, Inc.

theme:
  name: material
  custom_dir: overrides
  logo: assets/scry-mark.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark mode — Scry brand default.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light mode — warm cream variant.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - announce.dismiss

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Get the Scry app: get-started/install-android.md
      - Install scry-connect on the robot: get-started/install-connect.md
      - Choose your AI: get-started/choose-ai.md
      - Pair the phone and robot: get-started/pair.md
      - First session: get-started/first-session.md
  - Use Scry:
      - use/index.md
      - Chat with Scry: use/chat.md
      - File attachments and images: use/attachments.md
      - Voice input: use/voice.md
      - Background monitors: use/monitors.md
      - Connect from anywhere: use/remote.md
      - Sending feedback: use/feedback.md
  - How Scry works: how-it-works.md
  - Reference:
      - reference/index.md
      - What Scry can do: reference/mcp-tools.md
      - Permissions: reference/permissions.md
  - Legal:
      - legal/index.md
      - Privacy policy: legal/privacy.md
      - Data safety: legal/data-safety.md
      - Security policy: legal/security.md
      - License: legal/license.md

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phaneron-robotics
      name: Phaneron Robotics on GitHub
    - icon: fontawesome/solid/globe
      link: https://www.phaneronrobotics.com/
      name: phaneronrobotics.com
  generator: false

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
